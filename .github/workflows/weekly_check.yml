name: Daily check

on:
  schedule:
    # Every weekday at 22:00 UTC, after the US market closes
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the screener
        run: python future/future_screen.py

      - name: Work out the fair prices
        run: python future/fair_price.py

      - name: Check the alerts
        run: python future/alerts.py

      - name: Save the results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/future data/alerts
          git commit -m "Daily check" || echo "Nothing new"
          git push

      - name: Open an issue if the alerts changed since the last check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "ALERTS CHANGED SINCE THE LAST CHECK" data/alerts/latest.md; then
            gh issue create --title "Portfolio alerts $(date +%F)" --body-file data/alerts/latest.md
          fi
